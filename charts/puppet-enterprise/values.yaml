image:
  repository: registry.example.test/pe-k8s-runtime
  tag: "2025.9.0"
  pullPolicy: IfNotPresent

nameOverride: ""
instanceOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

affinity: {}

tolerations: []

probes:
  startup:
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

network:
  technicalHostname: ""
  compilerHostname: ""
  additionalDnsAltNames: []
  podLoopbackAliases:
    - puppet
  hostAliases: []

peConfig:
  consoleAdminPassword: "dummyPassword1!"
  certname: ""
  puppetMasterHost: ""
  extra: ""

codeManager:
  enabled: false
  autoConfigure: true
  r10kRemote: ""
  r10kPrivateKeyPath: /r10k-secret/r10k-deploy-key
  r10kPrivateKeySecretName: ""
  r10kPrivateKeySecretKey: r10k-deploy-key
  r10kKnownHosts: []
  r10kRemoteTimeout: 60

license:
  secretName: ""

storage:
  etc:
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClassName: ""
  opt:
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClassName: ""
  runtime:
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClassName: ""

controlPlane:
  replicaCount: 1
  podManagementPolicy: OrderedReady
  frontDoor:
    selectorPollIntervalSeconds: 5
  ca:
    provider: selfSigned
    importTimeoutSeconds: 300
    certManager:
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      duration: 87600h
      renewBefore: 720h
      rootSecretNamespace: ""
      rootSecretName: ""
      privateKey:
        algorithm: RSA
        size: 4096
        rotationPolicy: Never
    releaseRoot:
      rootSecretName: ""
      bundleSecretName: ""
      rootCommonName: ""
      durationDays: 3650
      intermediateDurationDays: 3650
      keyAlgorithm: RSA
      keySize: 4096
      initialSerial: 1000
  resources:
    postgresql: {}
    puppetdb: {}
    puppetserver: {}
    nginx: {}
    consoleServices: {}
    orchestrationServices: {}
    boltServer: {}
    aceServer: {}
    hostActionCollector: {}

conductor:
  mode: auto
  enabled: false
  namespace: ""
  resourcePrefix: conductor
  segmentName: production
  sharedState:
    cassandra:
      serviceName: conductor-cassandra
  participant:
    image:
      repository: registry.example.test/pe-k8s-conductor
      tag: "dev"
      pullPolicy: IfNotPresent
    heartbeatIntervalSeconds: 15
    secretPollIntervalSeconds: 15
    statusMaxAgeSeconds: 60
    trustPollIntervalSeconds: 15
    trustOutputDir: /var/lib/conductor/trust
    resources: {}
  relay:
    enabled: true
    publishIntervalSeconds: 15
    secretPollIntervalSeconds: 15
    statusMaxAgeSeconds: 60
    peerStatusMaxAgeSeconds: 60
    puppetdbSyncMaxAgeSeconds: 900
    puppetdbStatusUrl: https://127.0.0.1:8081/status/v1/services?level=debug
    outputDir: /var/lib/conductor/relay
    caSync:
      enabled: true
      publishIntervalSeconds: 15
      maxAgeSeconds: 60
      stateDir: /etc/puppetlabs/puppetserver/ca
      targetRoles:
        - control-plane
    commandProxy:
      enabled: true
      bindHost: 0.0.0.0
      port: 18081
      targetRoles:
        - control-plane
      replicatedCommands:
        - replace facts
        - store report
        - deactivate node
    authBarrier:
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_auth
        table: loginsession
        replicationFactor: 3
    codeDeploy:
      enabled: true
      statusPollIntervalSeconds: 60
      requestTimeoutSeconds: 900
      targetRoles:
        - control-plane
      auth:
        username: admin
        password: ""
        tokenLifetime: 15m
        tokenLabel: pe-k8s-conductor-code-deploy
      hook:
        listenHost: 0.0.0.0
        listenPort: 18082
        path: /conductor/code-manager/v1/post-environment
        useClientSsl: true
    classifierSync:
      enabled: true
      targetRoles:
        - control-plane
      auth:
        username: admin
        password: ""
        tokenLifetime: 15m
        tokenLabel: pe-k8s-conductor-classifier-sync
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_classifier
        table: classifier_state
        replicationFactor: 3
    rbacSync:
      enabled: true
      targetRoles:
        - control-plane
      excludedTokenLabelPrefixes:
        - pe-k8s-conductor-
        - pe-k8s-classifier
        - pe-k8s-compiler certificate
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_auth
        table: rbac_state
        replicationFactor: 3
    rbacTokenSync:
      enabled: true
      targetRoles:
        - control-plane
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_auth
        table: rbac_token_state
        replicationFactor: 3
    orchestrationSync:
      enabled: true
      targetRoles:
        - control-plane
      orchestratorConfPath: /etc/puppetlabs/orchestration-services/conf.d/orchestrator.conf
      inventoryConfPath: /etc/puppetlabs/orchestration-services/conf.d/inventory.conf
      sequenceStride: 1024
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_orchestration
        table: orchestrator_state
        replicationFactor: 3
    inventorySync:
      enabled: true
      targetRoles:
        - control-plane
      inventoryConfPath: /etc/puppetlabs/orchestration-services/conf.d/inventory.conf
      cassandra:
        contactPoints: []
        port: 9042
        keyspace: conductor_orchestration
        table: inventory_state
        replicationFactor: 3
    resources: {}
  gateway:
    enabled: true
    publishIntervalSeconds: 15
    secretPollIntervalSeconds: 15
    statusMaxAgeSeconds: 60
    peerStatusMaxAgeSeconds: 60
    outputDir: /var/lib/conductor/gateway
    pcp:
      enabled: true
      listenHost: 0.0.0.0
      listenPort: 18142
      targetHost: 127.0.0.1
      targetPort: 8142
      connectTimeoutSeconds: 5
      healthcheckTimeoutSeconds: 5
    orchestration:
      enabled: true
      listenHost: 0.0.0.0
      listenPort: 18143
      targetHost: 127.0.0.1
      targetPort: 8143
      statusUrl: https://127.0.0.1:8143/status/v1/services/status-service
      connectTimeoutSeconds: 5
      statusTimeoutSeconds: 5
    resources: {}
  controlPlaneTrust:
    caPath: /etc/puppetlabs/puppet/ssl/certs/ca.pem
    crlPath: /etc/puppetlabs/puppet/ssl/crl-chain.pem

installer:
  forceReinstall: false
  resources: {}

compilers:
  enabled: false
  replicaCount: 0
  dnsAltNames: []
  pcpBrokerHost: ""
  classifierWaitTimeoutSeconds: 900
  puppetdbSyncIntervalMinutes: 5
  puppetdbMaxSyncAgeSeconds: 900
  certWaitTimeoutSeconds: 900
  signerWaitTimeoutSeconds: 900
  resources:
    classifier: {}
    install: {}
    bootstrap: {}
    signer: {}
    postgresql: {}
    puppetserver: {}
    puppetdb: {}
  storage:
    etc:
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""
    opt:
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      storageClassName: ""
    runtime:
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""

services:
  pe:
    type: ClusterIP
    loadBalancerIP: ""
  compilers:
    type: ClusterIP
    port: 8140
    pcpPort: 8142
    loadBalancerIP: ""
  consoleServices:
    type: ClusterIP
    port: 4433
  orchestration:
    type: ClusterIP
    pcpPort: 8142
    servicePort: 8143
    codeManagerPort: 8170
  hostActionCollector:
    type: ClusterIP
    port: 8147
  boltServer:
    type: ClusterIP
    port: 62658
  aceServer:
    type: ClusterIP
    port: 44633

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: puppet.example.test
  tls:
    enabled: true
    secretName: puppet-example-test-tls
