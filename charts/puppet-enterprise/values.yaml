image:
  repository: registry.example.test/pe-k8s-runtime
  tag: "2025.9.0"
  pullPolicy: IfNotPresent

peProxy:
  image:
    repository: haproxy
    tag: "2.9-alpine"
    pullPolicy: IfNotPresent
  resources: {}

nameOverride: ""
instanceOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

affinity: {}

tolerations: []

probes:
  startup:
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

network:
  technicalHostname: ""
  additionalDnsAltNames: []
  podLoopbackAliases:
    - puppet
  hostAliases: []

peConfig:
  consoleAdminPassword: "dummyPassword1!"
  certname: ""
  puppetMasterHost: ""
  extra: ""

codeManager:
  enabled: false
  autoConfigure: true
  r10kRemote: ""
  r10kPrivateKeyPath: /r10k-secret/r10k-deploy-key
  r10kPrivateKeySecretName: ""
  r10kPrivateKeySecretKey: r10k-deploy-key
  r10kKnownHosts: []
  r10kRemoteTimeout: 60

license:
  secretName: ""

storage:
  etc:
    accessModes:
      - ReadWriteMany
    size: 2Gi
    storageClassName: ""
  opt:
    accessModes:
      - ReadWriteMany
    size: 50Gi
    storageClassName: ""
  runtime:
    accessModes:
      - ReadWriteMany
    size: 2Gi
    storageClassName: ""

installer:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  forceReinstall: false
  resources: {}

certificateRegeneration:
  enabled: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  force: true
  managePxpService: false
  resources: {}

certificateRecovery:
  enabled: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  resources: {}

postgresql:
  replicaCount: 1
  resources: {}

puppetdb:
  replicaCount: 1
  resources: {}

puppetserver:
  resources: {}

compilers:
  enabled: false
  replicaCount: 0
  dnsAltNames: []
  puppetdbSyncIntervalMinutes: 5
  certWaitTimeoutSeconds: 900
  signerWaitTimeoutSeconds: 900
  resources:
    install: {}
    bootstrap: {}
    signer: {}
    puppetserver: {}
    puppetdb: {}
  storage:
    etc:
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""
    opt:
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      storageClassName: ""
    runtime:
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""

peServices:
  replicaCount: 1
  resources:
    nginx: {}
    consoleServices: {}
    orchestrationServices: {}
    boltServer: {}
    aceServer: {}
    hostActionCollector: {}

services:
  publishNotReadyAddresses: true
  pe:
    type: ClusterIP
    loadBalancerIP: ""
  compilers:
    type: ClusterIP
    port: 8140
    loadBalancerIP: ""
  puppetdb:
    type: ClusterIP
    port: 8081
  consoleServices:
    type: ClusterIP
    port: 4433
  orchestration:
    type: ClusterIP
    pcpPort: 8142
    servicePort: 8143
    codeManagerPort: 8170
  hostActionCollector:
    type: ClusterIP
    port: 8147
  boltServer:
    type: ClusterIP
    port: 62658
  aceServer:
    type: ClusterIP
    port: 44633

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: puppet.example.test
  tls:
    enabled: true
    secretName: puppet-example-test-tls
