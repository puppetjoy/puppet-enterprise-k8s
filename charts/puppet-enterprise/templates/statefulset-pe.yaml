{{- if and .Values.peConfig.certname (gt (int .Values.controlPlane.replicaCount) 1) }}
{{ fail "peConfig.certname cannot be set when controlPlane.replicaCount > 1" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pe.controlPlaneStatefulSetName" . }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
    app.kubernetes.io/component: pe-services
spec:
  serviceName: {{ include "pe.controlPlaneHeadlessServiceName" . }}
  podManagementPolicy: {{ .Values.controlPlane.podManagementPolicy }}
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pe-services
  template:
    metadata:
      annotations:
        pe-k8s/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: pe-services
    spec:
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
{{ include "pe.controlPlaneLoopbackAliases" . | indent 12 }}
        {{- with .Values.network.hostAliases }}
{{ toYaml . | indent 8 }}
        {{- end }}
      initContainers:
        - name: install
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "install"]
          env:
            - name: PE_CONF_TEMPLATE_PATH
              value: /config/pe.conf
            - name: PE_CONF_PATH
              value: /var/lib/pe-k8s/install/pe.conf
            - name: FORCE_REINSTALL
              value: {{ ternary "true" "false" .Values.installer.forceReinstall | quote }}
            - name: PE_CONTROL_PLANE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PE_CONTROL_PLANE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PE_CONTROL_PLANE_HEADLESS_SERVICE
              value: {{ include "pe.controlPlaneHeadlessServiceName" . | quote }}
            - name: PE_CONTROL_PLANE_SHARED_DNS_ALT_NAMES
              value: {{ include "pe.controlPlaneFrontDoorDnsNamesCsv" . | quote }}
            - name: PE_CONTROL_PLANE_CA_PROVIDER
              value: {{ .Values.controlPlane.ca.provider | quote }}
            - name: PE_CONTROL_PLANE_CA_IMPORT_TIMEOUT_SECONDS
              value: {{ .Values.controlPlane.ca.importTimeoutSeconds | quote }}
            {{- if eq .Values.controlPlane.ca.provider "releaseRoot" }}
            - name: PE_CONTROL_PLANE_CA_BUNDLE_SECRET_NAME
              value: {{ include "pe.controlPlaneCaBundleSecretName" . | quote }}
            {{- end }}
            {{- if eq .Values.controlPlane.ca.provider "certManager" }}
            - name: PE_CONTROL_PLANE_CA_ROOT_SECRET_NAMESPACE
              value: {{ default .Release.Namespace .Values.controlPlane.ca.certManager.rootSecretNamespace | quote }}
            - name: PE_CONTROL_PLANE_CA_ROOT_SECRET_NAME
              value: {{ required "controlPlane.ca.certManager.rootSecretName is required when controlPlane.ca.provider=certManager" .Values.controlPlane.ca.certManager.rootSecretName | quote }}
            {{- end }}
            {{- if .Values.peConfig.certname }}
            - name: PE_CONTROL_PLANE_CERTNAME
              value: {{ .Values.peConfig.certname | quote }}
            {{- end }}
          resources:
{{ toYaml .Values.installer.resources | indent 12 }}
          volumeMounts:
            - name: pe-conf
              mountPath: /config
              readOnly: true
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
            {{- if .Values.license.secretName }}
            - name: license
              mountPath: /license
              readOnly: true
            {{- end }}
            {{- if .Values.codeManager.enabled }}
            - name: code-manager-r10k-key
              mountPath: {{ dir (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) | quote }}
              readOnly: true
            {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "postgresql"]
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.postgresql | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetdb"]
          env:
            - name: PE_K8S_PUPPETDB_DATABASE_HOST
              value: 127.0.0.1
            - name: PE_K8S_PUPPETDB_DATABASE_PORT
              value: "5432"
          ports:
            - name: puppetdb
              containerPort: 8081
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.puppetdb | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetserver"]
          env:
            - name: PE_K8S_RELAY_COMMAND_PROXY_ENABLED
              value: {{ ternary "true" "false" (and .Values.conductor.enabled .Values.conductor.relay.enabled .Values.conductor.relay.commandProxy.enabled) | quote }}
            - name: PE_K8S_RELAY_COMMAND_PROXY_PORT
              value: {{ .Values.conductor.relay.commandProxy.port | quote }}
            - name: PE_K8S_CODE_DEPLOY_HOOK_ENABLED
              value: {{ ternary "true" "false" (and .Values.conductor.enabled .Values.conductor.relay.enabled .Values.conductor.relay.codeDeploy.enabled) | quote }}
            - name: PE_K8S_CODE_DEPLOY_HOOK_URL
              value: {{ printf "https://%s:%v%s" (include "pe.identity" .) .Values.conductor.relay.codeDeploy.hook.listenPort .Values.conductor.relay.codeDeploy.hook.path | quote }}
            - name: PE_K8S_CODE_DEPLOY_HOOK_USE_CLIENT_SSL
              value: {{ ternary "true" "false" .Values.conductor.relay.codeDeploy.hook.useClientSsl | quote }}
          ports:
            - name: puppetserver
              containerPort: 8140
            {{- if .Values.codeManager.enabled }}
            - name: code-manager
              containerPort: 8170
            {{- end }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.puppetserver | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
            {{- if .Values.codeManager.enabled }}
            - name: code-manager-r10k-key
              mountPath: {{ dir (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) | quote }}
              readOnly: true
            {{- end }}
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "nginx"]
          ports:
            - name: nginx-http
              containerPort: 80
            - name: nginx-https
              containerPort: 443
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "nginx"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "nginx"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "nginx"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.nginx | indent 12 }}
          volumeMounts: &controlPlaneMounts
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
            {{- if .Values.codeManager.enabled }}
            - name: code-manager-r10k-key
              mountPath: {{ dir (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) | quote }}
              readOnly: true
            {{- end }}
        - name: console-services
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "console-services"]
          ports:
            - name: console-svc
              containerPort: 4433
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "console-services"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "console-services"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "console-services"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.consoleServices | indent 12 }}
          volumeMounts: *controlPlaneMounts
        - name: orchestration-services
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "orchestration-services"]
          env:
            - name: PE_K8S_ORCHESTRATOR_PCP_BROKERS_CSV
              value: {{ include "pe.orchestratorPcpBrokerCertnamesCsv" . | quote }}
          ports:
            - name: orch-pcp
              containerPort: 8142
            - name: orch-svc
              containerPort: 8143
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "orchestration-services"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "orchestration-services"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "orchestration-services"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.orchestrationServices | indent 12 }}
          volumeMounts: *controlPlaneMounts
        - name: bolt-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "bolt-server"]
          ports:
            - name: bolt-svc
              containerPort: 62658
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "bolt-server"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "bolt-server"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "bolt-server"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.boltServer | indent 12 }}
          volumeMounts: *controlPlaneMounts
        - name: ace-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "ace-server"]
          ports:
            - name: ace-svc
              containerPort: 44633
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "ace-server"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "ace-server"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "ace-server"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.aceServer | indent 12 }}
          volumeMounts: *controlPlaneMounts
        - name: host-action-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "host-action-collector"]
          ports:
            - name: hac-svc
              containerPort: 8147
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "host-action-collector"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "host-action-collector"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "host-action-collector"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.controlPlane.resources.hostActionCollector | indent 12 }}
          volumeMounts: *controlPlaneMounts
        {{- if .Values.conductor.enabled }}
        - name: conductor-participant
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-participant"]
          env:
            - name: CONDUCTOR_PARTICIPANT_ROLE
              value: control-plane
            - name: CONDUCTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONDUCTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONDUCTOR_NAMESPACE
              value: {{ include "pe.conductorNamespace" . | quote }}
            - name: CONDUCTOR_RESOURCE_PREFIX
              value: {{ .Values.conductor.resourcePrefix | quote }}
            - name: CONDUCTOR_SEGMENT_NAME
              value: {{ .Values.conductor.segmentName | quote }}
            - name: CONDUCTOR_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.heartbeatIntervalSeconds | quote }}
            - name: CONDUCTOR_SECRET_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.secretPollIntervalSeconds | quote }}
            - name: CONDUCTOR_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.participant.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_TRUST_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.trustPollIntervalSeconds | quote }}
            - name: CONDUCTOR_TRUST_OUTPUT_DIR
              value: {{ .Values.conductor.participant.trustOutputDir | quote }}
            - name: CONDUCTOR_TRUST_SOURCE_CA_PATH
              value: {{ .Values.conductor.controlPlaneTrust.caPath | quote }}
            - name: CONDUCTOR_TRUST_SOURCE_CRL_PATH
              value: {{ .Values.conductor.controlPlaneTrust.crlPath | quote }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/conductor-participant", "probe", "ready"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.conductor.participant.resources | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
              readOnly: true
            - name: conductor-trust
              mountPath: {{ .Values.conductor.participant.trustOutputDir | quote }}
        {{- if .Values.conductor.relay.enabled }}
        - name: conductor-relay
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-relay"]
          securityContext:
            runAsUser: 0
          env:
            - name: CONDUCTOR_RELAY_ROLE
              value: control-plane
            - name: CONDUCTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONDUCTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONDUCTOR_NAMESPACE
              value: {{ include "pe.conductorNamespace" . | quote }}
            - name: CONDUCTOR_RESOURCE_PREFIX
              value: {{ .Values.conductor.resourcePrefix | quote }}
            - name: CONDUCTOR_SEGMENT_NAME
              value: {{ .Values.conductor.segmentName | quote }}
            - name: CONDUCTOR_RELAY_SECRET_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.secretPollIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUBLISH_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.publishIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PEER_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.peerStatusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUPPETDB_SYNC_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.puppetdbSyncMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUPPETDB_STATUS_URL
              value: {{ .Values.conductor.relay.puppetdbStatusUrl | quote }}
            - name: CONDUCTOR_RELAY_OUTPUT_DIR
              value: {{ .Values.conductor.relay.outputDir | quote }}
            - name: CONDUCTOR_RELAY_PARTICIPANT_STATUS_PATH
              value: {{ printf "%s/participant-status.json" .Values.conductor.participant.trustOutputDir | quote }}
            - name: CONDUCTOR_RELAY_PARTICIPANT_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.participant.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_CA_SYNC_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.relay.caSync.enabled | quote }}
            - name: CONDUCTOR_RELAY_CA_SYNC_DIR
              value: {{ .Values.conductor.relay.caSync.stateDir | quote }}
            - name: CONDUCTOR_RELAY_CA_SYNC_PUBLISH_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.caSync.publishIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_CA_SYNC_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.caSync.maxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_CA_SYNC_TARGET_ROLES
              value: {{ join "," .Values.conductor.relay.caSync.targetRoles | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_PROXY_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.relay.commandProxy.enabled | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_PROXY_PORT
              value: {{ .Values.conductor.relay.commandProxy.port | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_TARGET_ROLES
              value: {{ join "," .Values.conductor.relay.commandProxy.targetRoles | quote }}
            - name: CONDUCTOR_RELAY_REPLICATED_COMMANDS
              value: {{ join "," .Values.conductor.relay.commandProxy.replicatedCommands | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.relay.codeDeploy.enabled | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_STATUS_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.codeDeploy.statusPollIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.conductor.relay.codeDeploy.requestTimeoutSeconds | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_TARGET_ROLES
              value: {{ join "," .Values.conductor.relay.codeDeploy.targetRoles | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_SERVICE_HOST
              value: {{ include "pe.identity" . | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_USERNAME
              value: {{ .Values.conductor.relay.codeDeploy.auth.username | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_PASSWORD
              value: {{ default .Values.peConfig.consoleAdminPassword .Values.conductor.relay.codeDeploy.auth.password | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_TOKEN_LIFETIME
              value: {{ .Values.conductor.relay.codeDeploy.auth.tokenLifetime | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_TOKEN_LABEL
              value: {{ .Values.conductor.relay.codeDeploy.auth.tokenLabel | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_HOOK_LISTEN_HOST
              value: {{ .Values.conductor.relay.codeDeploy.hook.listenHost | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_HOOK_LISTEN_PORT
              value: {{ .Values.conductor.relay.codeDeploy.hook.listenPort | quote }}
            - name: CONDUCTOR_RELAY_CODE_DEPLOY_HOOK_PATH
              value: {{ .Values.conductor.relay.codeDeploy.hook.path | quote }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/conductor-relay", "probe", "ready"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.conductor.relay.resources | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
              readOnly: {{ not .Values.conductor.relay.caSync.enabled }}
            - name: conductor-trust
              mountPath: {{ .Values.conductor.participant.trustOutputDir | quote }}
              readOnly: true
            - name: conductor-relay
              mountPath: {{ .Values.conductor.relay.outputDir | quote }}
        {{- end }}
        {{- if .Values.conductor.gateway.enabled }}
        - name: conductor-gateway
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-gateway"]
          env:
            - name: CONDUCTOR_GATEWAY_ROLE
              value: control-plane
            - name: CONDUCTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONDUCTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONDUCTOR_NAMESPACE
              value: {{ include "pe.conductorNamespace" . | quote }}
            - name: CONDUCTOR_RESOURCE_PREFIX
              value: {{ .Values.conductor.resourcePrefix | quote }}
            - name: CONDUCTOR_SEGMENT_NAME
              value: {{ .Values.conductor.segmentName | quote }}
            - name: CONDUCTOR_GATEWAY_SECRET_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.gateway.secretPollIntervalSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_PUBLISH_INTERVAL_SECONDS
              value: {{ .Values.conductor.gateway.publishIntervalSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.gateway.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_PEER_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.gateway.peerStatusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_OUTPUT_DIR
              value: {{ .Values.conductor.gateway.outputDir | quote }}
            - name: CONDUCTOR_GATEWAY_PARTICIPANT_STATUS_PATH
              value: {{ printf "%s/participant-status.json" .Values.conductor.participant.trustOutputDir | quote }}
            - name: CONDUCTOR_GATEWAY_PARTICIPANT_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.participant.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_PROXY_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.gateway.pcp.enabled | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_LISTEN_HOST
              value: {{ .Values.conductor.gateway.pcp.listenHost | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_LISTEN_PORT
              value: {{ .Values.conductor.gateway.pcp.listenPort | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_TARGET_HOST
              value: {{ .Values.conductor.gateway.pcp.targetHost | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_TARGET_PORT
              value: {{ .Values.conductor.gateway.pcp.targetPort | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.conductor.gateway.pcp.connectTimeoutSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_PCP_HEALTHCHECK_TIMEOUT_SECONDS
              value: {{ .Values.conductor.gateway.pcp.healthcheckTimeoutSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_PROXY_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.gateway.orchestration.enabled | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_LISTEN_HOST
              value: {{ .Values.conductor.gateway.orchestration.listenHost | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_LISTEN_PORT
              value: {{ .Values.conductor.gateway.orchestration.listenPort | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_TARGET_HOST
              value: {{ .Values.conductor.gateway.orchestration.targetHost | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_TARGET_PORT
              value: {{ .Values.conductor.gateway.orchestration.targetPort | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_STATUS_URL
              value: {{ .Values.conductor.gateway.orchestration.statusUrl | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.conductor.gateway.orchestration.connectTimeoutSeconds | quote }}
            - name: CONDUCTOR_GATEWAY_ORCHESTRATION_STATUS_TIMEOUT_SECONDS
              value: {{ .Values.conductor.gateway.orchestration.statusTimeoutSeconds | quote }}
          ports:
            - name: gw-pcp
              containerPort: {{ .Values.conductor.gateway.pcp.listenPort }}
            - name: gw-orch
              containerPort: {{ .Values.conductor.gateway.orchestration.listenPort }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/conductor-gateway", "probe", "ready"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.conductor.gateway.resources | indent 12 }}
          volumeMounts:
            - name: conductor-trust
              mountPath: {{ .Values.conductor.participant.trustOutputDir | quote }}
              readOnly: true
            - name: conductor-gateway
              mountPath: {{ .Values.conductor.gateway.outputDir | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.controlPlane.console.enabled }}
        - name: conductor-console-selector
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-console-selector"]
          env:
            - name: CONSOLE_SELECTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONSOLE_SELECTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONSOLE_SELECTOR_STATEFULSET_NAME
              value: {{ include "pe.controlPlaneStatefulSetName" . | quote }}
            - name: CONSOLE_SELECTOR_LABEL_SELECTOR
              value: {{ printf "app.kubernetes.io/instance=%s,app.kubernetes.io/component=pe-services" .Release.Name | quote }}
            - name: CONSOLE_SELECTOR_ACTIVE_LABEL_KEY
              value: pe-k8s.puppet.com/console-active
            - name: CONSOLE_SELECTOR_ACTIVE_LABEL_VALUE
              value: "true"
            - name: CONSOLE_SELECTOR_POLL_INTERVAL_SECONDS
              value: {{ .Values.controlPlane.console.selectorPollIntervalSeconds | quote }}
          resources: {}
        {{- end }}
      volumes:
        - name: pe-conf
          configMap:
            name: {{ include "pe.fullname" . }}-conf
        - name: logs
          emptyDir: {}
        {{- if .Values.conductor.enabled }}
        - name: conductor-trust
          emptyDir: {}
        {{- if .Values.conductor.relay.enabled }}
        - name: conductor-relay
          emptyDir: {}
        {{- end }}
        {{- if .Values.conductor.gateway.enabled }}
        - name: conductor-gateway
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.license.secretName }}
        - name: license
          secret:
            secretName: {{ .Values.license.secretName }}
        {{- end }}
        {{- if .Values.codeManager.enabled }}
        - name: code-manager-r10k-key
          secret:
            secretName: {{ required "codeManager.r10kPrivateKeySecretName is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeySecretName }}
            items:
              - key: {{ required "codeManager.r10kPrivateKeySecretKey is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeySecretKey }}
                path: {{ base (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: etc
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: pe-services
      spec:
        accessModes:
{{ toYaml .Values.storage.etc.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.storage.etc.size }}
        storageClassName: {{ .Values.storage.etc.storageClassName | quote }}
    - metadata:
        name: opt
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: pe-services
      spec:
        accessModes:
{{ toYaml .Values.storage.opt.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.storage.opt.size }}
        storageClassName: {{ .Values.storage.opt.storageClassName | quote }}
    - metadata:
        name: runtime
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: pe-services
      spec:
        accessModes:
{{ toYaml .Values.storage.runtime.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.storage.runtime.size }}
        storageClassName: {{ .Values.storage.runtime.storageClassName | quote }}
