apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pe.fullname" . }}-installer-r{{ .Release.Revision }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.installer.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.installer.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: installer
    spec:
      hostname: {{ include "pe.identity" . }}
      restartPolicy: OnFailure
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - {{ include "pe.identity" . | quote }}
        {{- with .Values.network.hostAliases }}
{{ toYaml . | indent 8 }}
        {{- end }}
      containers:
        - name: installer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "install"]
          env:
            - name: PE_CONF_PATH
              value: /config/pe.conf
            - name: FORCE_REINSTALL
              value: {{ ternary "true" "false" .Values.installer.forceReinstall | quote }}
            - name: PE_K8S_AUTOSIGN_MODE
              value: {{ .Values.testAgents.autosign.mode | quote }}
            - name: PE_BOOTSTRAP_PUPPET_CERTNAME
              value: {{ include "pe.identity" . | quote }}
            - name: PE_BOOTSTRAP_PUPPET_SERVER
              value: {{ include "pe.identity" . | quote }}
            - name: FACTER_hostname
              value: {{ include "pe.identity" . | quote }}
            - name: FACTER_fqdn
              value: {{ include "pe.identity" . | quote }}
            - name: FACTER_domain
              value: ""
          resources:
{{ toYaml .Values.installer.resources | indent 12 }}
          volumeMounts:
            - name: pe-conf
              mountPath: /config
              readOnly: true
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
            {{- if .Values.license.secretName }}
            - name: license
              mountPath: /license
              readOnly: true
            {{- end }}
            {{- if .Values.codeManager.enabled }}
            - name: code-manager-r10k-key
              mountPath: {{ dir (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: pe-conf
          configMap:
            name: {{ include "pe.fullname" . }}-conf
        - name: etc
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-etc
        - name: opt
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-opt
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-runtime
        - name: logs
          emptyDir: {}
        {{- if .Values.license.secretName }}
        - name: license
          secret:
            secretName: {{ .Values.license.secretName }}
        {{- end }}
        {{- if .Values.codeManager.enabled }}
        - name: code-manager-r10k-key
          secret:
            secretName: {{ required "codeManager.r10kPrivateKeySecretName is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeySecretName }}
            items:
              - key: {{ required "codeManager.r10kPrivateKeySecretKey is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeySecretKey }}
                path: {{ base (required "codeManager.r10kPrivateKeyPath is required when codeManager.enabled=true" .Values.codeManager.r10kPrivateKeyPath) }}
        {{- end }}
