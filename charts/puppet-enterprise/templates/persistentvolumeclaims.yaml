apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pe.fullname" . }}-etc
  labels:
    {{- include "pe.labels" . | nindent 4 }}
spec:
  accessModes:
{{ toYaml .Values.storage.etc.accessModes | indent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.etc.size }}
  {{- if .Values.storage.etc.storageClassName }}
  storageClassName: {{ .Values.storage.etc.storageClassName }}
  {{- end }}
---
