{{- if and .Values.compilers.enabled (gt (int .Values.compilers.replicaCount) 0) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pe.compilerStatefulSetName" . }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
    app.kubernetes.io/component: compiler
spec:
  serviceName: {{ include "pe.compilerHeadlessServiceName" . }}
  replicas: {{ .Values.compilers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: compiler
  template:
    metadata:
      annotations:
        pe-k8s/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: compiler
    spec:
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- with .Values.network.hostAliases }}
      hostAliases:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: install-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "install-compiler-runtime"]
          resources:
{{ toYaml .Values.compilers.resources.install | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "bootstrap-compiler"]
          env:
            - name: PE_COMPILER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PE_COMPILER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PE_COMPILER_HEADLESS_SERVICE
              value: {{ include "pe.compilerHeadlessServiceName" . | quote }}
            - name: PE_COMPILER_PE_SERVICE
              value: {{ include "pe.identity" . | quote }}
            - name: PE_COMPILER_ORCHESTRATION_SERVICE
              value: {{ include "pe.identity" . | quote }}
            - name: PE_COMPILER_PE_CERTNAME
              value: {{ include "pe.certname" . | quote }}
            - name: PE_COMPILER_PUPPETDB_HOST
              value: {{ include "pe.identity" . | quote }}
            - name: PE_COMPILER_PCP_BROKER_HOST
              value: {{ include "pe.compilerPcpBrokerHost" . | quote }}
            - name: PE_COMPILER_DNS_ALT_NAMES
              value: {{ include "pe.compilerPoolDnsNamesCsv" . | quote }}
            - name: PE_COMPILER_PUPPETDB_SYNC_INTERVAL_MINUTES
              value: {{ .Values.compilers.puppetdbSyncIntervalMinutes | quote }}
            - name: PE_COMPILER_CERT_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.compilers.certWaitTimeoutSeconds | quote }}
            {{- if eq .Values.controlPlane.ca.provider "releaseRoot" }}
            - name: PE_CONTROL_PLANE_CA_BUNDLE_SECRET_NAME
              value: {{ include "pe.controlPlaneCaBundleSecretName" . | quote }}
            {{- end }}
          resources:
{{ toYaml .Values.compilers.resources.bootstrap | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "postgresql"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.postgresql | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetdb"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
            - name: PE_K8S_PUPPETDB_DATABASE_HOST
              value: 127.0.0.1
            - name: PE_K8S_PUPPETDB_DATABASE_PORT
              value: "5432"
          ports:
            - name: puppetdb
              containerPort: 8081
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.puppetdb | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetserver"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
            - name: PE_K8S_COMPILER_PE_SERVICE
              value: {{ include "pe.identity" . | quote }}
            - name: PE_K8S_COMPILER_FILE_SYNC_SERVICE
              value: {{ include "pe.identity" . | quote }}
            - name: PE_K8S_COMPILER_PUPPETDB_SYNC_MAX_AGE_SECONDS
              value: {{ .Values.compilers.puppetdbMaxSyncAgeSeconds | quote }}
            - name: PE_K8S_COMPILER_PCP_BROKER_PORT
              value: {{ .Values.services.compilers.pcpPort | quote }}
            - name: PE_K8S_RELAY_COMMAND_PROXY_ENABLED
              value: {{ ternary "true" "false" (and .Values.conductor.enabled .Values.conductor.relay.enabled .Values.conductor.relay.commandProxy.enabled) | quote }}
            - name: PE_K8S_RELAY_COMMAND_PROXY_PORT
              value: {{ .Values.conductor.relay.commandProxy.port | quote }}
          ports:
            - name: puppetserver
              containerPort: 8140
            - name: pcp-broker
              containerPort: {{ .Values.services.compilers.pcpPort }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "compiler-puppetserver"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.puppetserver | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        {{- if .Values.conductor.enabled }}
        - name: conductor-participant
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-participant"]
          env:
            - name: CONDUCTOR_PARTICIPANT_ROLE
              value: compiler
            - name: CONDUCTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONDUCTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONDUCTOR_NAMESPACE
              value: {{ include "pe.conductorNamespace" . | quote }}
            - name: CONDUCTOR_RESOURCE_PREFIX
              value: {{ .Values.conductor.resourcePrefix | quote }}
            - name: CONDUCTOR_SEGMENT_NAME
              value: {{ .Values.conductor.segmentName | quote }}
            - name: CONDUCTOR_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.heartbeatIntervalSeconds | quote }}
            - name: CONDUCTOR_SECRET_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.secretPollIntervalSeconds | quote }}
            - name: CONDUCTOR_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.participant.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_TRUST_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.participant.trustPollIntervalSeconds | quote }}
            - name: CONDUCTOR_TRUST_OUTPUT_DIR
              value: {{ .Values.conductor.participant.trustOutputDir | quote }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/conductor-participant", "probe", "ready"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.conductor.participant.resources | indent 12 }}
          volumeMounts:
            - name: conductor-trust
              mountPath: {{ .Values.conductor.participant.trustOutputDir | quote }}
        {{- if .Values.conductor.relay.enabled }}
        - name: conductor-relay
          image: "{{ .Values.conductor.participant.image.repository }}:{{ .Values.conductor.participant.image.tag }}"
          imagePullPolicy: {{ .Values.conductor.participant.image.pullPolicy }}
          command: ["/usr/local/bin/conductor-relay"]
          securityContext:
            runAsUser: 0
          env:
            - name: CONDUCTOR_RELAY_ROLE
              value: compiler
            - name: CONDUCTOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONDUCTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONDUCTOR_NAMESPACE
              value: {{ include "pe.conductorNamespace" . | quote }}
            - name: CONDUCTOR_RESOURCE_PREFIX
              value: {{ .Values.conductor.resourcePrefix | quote }}
            - name: CONDUCTOR_SEGMENT_NAME
              value: {{ .Values.conductor.segmentName | quote }}
            - name: CONDUCTOR_RELAY_SECRET_POLL_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.secretPollIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUBLISH_INTERVAL_SECONDS
              value: {{ .Values.conductor.relay.publishIntervalSeconds | quote }}
            - name: CONDUCTOR_RELAY_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PEER_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.peerStatusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUPPETDB_SYNC_MAX_AGE_SECONDS
              value: {{ .Values.conductor.relay.puppetdbSyncMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_PUPPETDB_STATUS_URL
              value: {{ .Values.conductor.relay.puppetdbStatusUrl | quote }}
            - name: CONDUCTOR_RELAY_OUTPUT_DIR
              value: {{ .Values.conductor.relay.outputDir | quote }}
            - name: CONDUCTOR_RELAY_PARTICIPANT_STATUS_PATH
              value: {{ printf "%s/participant-status.json" .Values.conductor.participant.trustOutputDir | quote }}
            - name: CONDUCTOR_RELAY_PARTICIPANT_STATUS_MAX_AGE_SECONDS
              value: {{ .Values.conductor.participant.statusMaxAgeSeconds | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_PROXY_ENABLED
              value: {{ ternary "true" "false" .Values.conductor.relay.commandProxy.enabled | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_PROXY_PORT
              value: {{ .Values.conductor.relay.commandProxy.port | quote }}
            - name: CONDUCTOR_RELAY_COMMAND_TARGET_ROLES
              value: {{ join "," .Values.conductor.relay.commandProxy.targetRoles | quote }}
            - name: CONDUCTOR_RELAY_REPLICATED_COMMANDS
              value: {{ join "," .Values.conductor.relay.commandProxy.replicatedCommands | quote }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/conductor-relay", "probe", "ready"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.conductor.relay.resources | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
              readOnly: true
            - name: conductor-trust
              mountPath: {{ .Values.conductor.participant.trustOutputDir | quote }}
              readOnly: true
            - name: conductor-relay
              mountPath: {{ .Values.conductor.relay.outputDir | quote }}
        {{- end }}
        {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if .Values.conductor.enabled }}
        - name: conductor-trust
          emptyDir: {}
        {{- if .Values.conductor.relay.enabled }}
        - name: conductor-relay
          emptyDir: {}
        {{- end }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: etc
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.etc.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.etc.size }}
        storageClassName: {{ .Values.compilers.storage.etc.storageClassName | quote }}
    - metadata:
        name: opt
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.opt.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.opt.size }}
        storageClassName: {{ .Values.compilers.storage.opt.storageClassName | quote }}
    - metadata:
        name: runtime
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.runtime.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.runtime.size }}
        storageClassName: {{ .Values.compilers.storage.runtime.storageClassName | quote }}
{{- end }}
