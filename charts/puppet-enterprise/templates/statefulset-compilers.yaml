{{- if and .Values.compilers.enabled (gt (int .Values.compilers.replicaCount) 0) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pe.compilerStatefulSetName" . }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
    app.kubernetes.io/component: compiler
spec:
  serviceName: {{ include "pe.compilerHeadlessServiceName" . }}
  replicas: {{ .Values.compilers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: compiler
  template:
    metadata:
      annotations:
        pe-k8s/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: compiler
    spec:
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- with .Values.network.hostAliases }}
      hostAliases:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        - name: install-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "install-compiler-runtime"]
          resources:
{{ toYaml .Values.compilers.resources.install | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "bootstrap-compiler"]
          env:
            - name: PE_COMPILER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PE_COMPILER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PE_COMPILER_HEADLESS_SERVICE
              value: {{ include "pe.compilerHeadlessServiceName" . | quote }}
            - name: PE_COMPILER_PE_SERVICE
              value: {{ include "pe.identity" . | quote }}
            - name: PE_COMPILER_PE_CERTNAME
              value: {{ include "pe.certname" . | quote }}
            - name: PE_COMPILER_PUPPETDB_HOST
              value: {{ include "pe.identity" . | quote }}
            - name: PE_COMPILER_DNS_ALT_NAMES
              value: {{ include "pe.compilerPoolDnsNamesCsv" . | quote }}
            - name: PE_COMPILER_PUPPETDB_SYNC_INTERVAL_MINUTES
              value: {{ .Values.compilers.puppetdbSyncIntervalMinutes | quote }}
            - name: PE_COMPILER_CERT_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.compilers.certWaitTimeoutSeconds | quote }}
          resources:
{{ toYaml .Values.compilers.resources.bootstrap | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "postgresql"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "postgresql"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.postgresql | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetdb"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
            - name: PE_K8S_PUPPETDB_DATABASE_HOST
              value: 127.0.0.1
            - name: PE_K8S_PUPPETDB_DATABASE_PORT
              value: "5432"
          ports:
            - name: puppetdb
              containerPort: 8081
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.puppetdb | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
        - name: puppetserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetserver"]
          env:
            - name: PE_K8S_SKIP_INSTALL_MARKER
              value: "true"
            - name: PE_K8S_COMPILER_PE_SERVICE
              value: {{ include "pe.identity" . | quote }}
          ports:
            - name: puppetserver
              containerPort: 8140
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "compiler-puppetserver"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetserver"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.compilers.resources.puppetserver | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: etc
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.etc.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.etc.size }}
        storageClassName: {{ .Values.compilers.storage.etc.storageClassName | quote }}
    - metadata:
        name: opt
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.opt.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.opt.size }}
        storageClassName: {{ .Values.compilers.storage.opt.storageClassName | quote }}
    - metadata:
        name: runtime
        labels:
          {{- include "pe.labels" . | nindent 10 }}
          app.kubernetes.io/component: compiler
      spec:
        accessModes:
{{ toYaml .Values.compilers.storage.runtime.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.compilers.storage.runtime.size }}
        storageClassName: {{ .Values.compilers.storage.runtime.storageClassName | quote }}
{{- end }}
