{{- if and (eq .Values.controlPlane.ca.provider "certManager") .Values.controlPlane.ca.certManager.rootSecretName (ne (default .Release.Namespace .Values.controlPlane.ca.certManager.rootSecretNamespace) .Release.Namespace) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pe.fullname" . }}-external-root-secret-reader
  namespace: {{ .Values.controlPlane.ca.certManager.rootSecretNamespace }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.controlPlane.ca.certManager.rootSecretName | quote }}
    verbs: ["get"]
{{- end }}
