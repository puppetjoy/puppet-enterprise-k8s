{{- if eq (include "pe.frontDoorSelectorEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pe.fullname" . }}-control-plane-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pe.fullname" . }}-control-plane-pods
{{- end }}
