apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pe.fullname" . }}-puppetdb
  labels:
    {{- include "pe.labels" . | nindent 4 }}
    app.kubernetes.io/component: puppetdb
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.puppetdb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: puppetdb
  template:
    metadata:
      annotations:
        pe-k8s/release-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: puppetdb
    spec:
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      initContainers:
        - name: wait-for-install
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "wait-for-install"]
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/pe-k8s
      containers:
        - name: puppetdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "run-role", "puppetdb"]
          ports:
            - name: puppetdb
              containerPort: 8081
          startupProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/pe-k8s-entrypoint", "probe", "puppetdb"]
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.puppetdb.resources | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-etc
        - name: opt
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-opt
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-runtime
        - name: logs
          emptyDir: {}
