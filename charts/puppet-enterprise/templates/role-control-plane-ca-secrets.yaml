{{- if or (eq .Values.controlPlane.ca.provider "certManager") (eq .Values.controlPlane.ca.provider "releaseRoot") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pe.fullname" . }}-control-plane-ca-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $index, $_ := until (int .Values.controlPlane.replicaCount) }}
      - {{ include "pe.controlPlaneCaSecretNameForIndex" (dict "root" $ "index" $index) | quote }}
      {{- end }}
      {{- if eq .Values.controlPlane.ca.provider "releaseRoot" }}
      - {{ include "pe.controlPlaneCaBundleSecretName" . | quote }}
      {{- end }}
      {{- if and (eq .Values.controlPlane.ca.provider "certManager") .Values.controlPlane.ca.certManager.rootSecretName (eq (default .Release.Namespace .Values.controlPlane.ca.certManager.rootSecretNamespace) .Release.Namespace) }}
      - {{ .Values.controlPlane.ca.certManager.rootSecretName | quote }}
      {{- end }}
    verbs: ["get"]
{{- end }}
