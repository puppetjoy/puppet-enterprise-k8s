{{- if or (eq (include "pe.consoleStickyEnabled" .) "true") (gt (int .Values.controlPlane.replicaCount) 1) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pe.fullname" . }}-control-plane-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
{{- end }}
