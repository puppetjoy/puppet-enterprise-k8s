{{- if eq (include "pe.conductorEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pe.fullname" . }}-conductor-secret-reader
  namespace: {{ include "pe.conductorNamespace" . }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
