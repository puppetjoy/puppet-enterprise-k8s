{{- if and .Values.compilers.enabled (gt (int .Values.compilers.replicaCount) 0) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pe.fullname" . }}-compiler-signer-r{{ .Release.Revision }}
  labels:
    {{- include "pe.labels" . | nindent 4 }}
    app.kubernetes.io/component: compiler-signer
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "pe.labels" . | nindent 8 }}
        app.kubernetes.io/component: compiler-signer
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "pe.serviceAccountName" . }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      containers:
        - name: signer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pe-k8s-entrypoint", "sign-certs"]
          env:
            - name: PE_SIGN_CERTNAMES
              value: {{ include "pe.compilerCertnamesCsv" . | quote }}
            - name: PE_SIGN_REQUIRED_INSTALL_JOB
              value: {{ printf "%s-installer-r%d" (include "pe.fullname" .) .Release.Revision | quote }}
            - name: PE_SIGN_CERT_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.compilers.signerWaitTimeoutSeconds | quote }}
            - name: PE_SIGN_CERT_LABEL
              value: "compiler certificate"
          resources:
{{ toYaml .Values.compilers.resources.signer | indent 12 }}
          volumeMounts:
            - name: etc
              mountPath: /etc/puppetlabs
            - name: opt
              mountPath: /opt/puppetlabs
            - name: runtime
              mountPath: /var/lib/pe-k8s
            - name: logs
              mountPath: /var/log/puppetlabs
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-etc
        - name: opt
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-opt
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "pe.fullname" . }}-runtime
        - name: logs
          emptyDir: {}
{{- end }}
