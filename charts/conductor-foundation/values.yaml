nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

nodeSelector: {}

affinity: {}

tolerations: []

serviceAccount:
  create: true
  name: ""

hub:
  image:
    repository: docker.io/library/rabbitmq
    tag: "3.13-management-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: admin
    password: change-me-now
    existingSecretName: ""
    usernameKey: username
    passwordKey: password
  service:
    type: ClusterIP
    loadBalancerIP: ""
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    storageClassName: ""
  resources: {}
  extraEnv: []

warden:
  enabled: true
  image:
    repository: registry.example.test/pe-k8s-conductor
    tag: "dev"
    pullPolicy: IfNotPresent
  intervalSeconds: 30
  logLevel: info
  pruneStaleParticipants: true
  resources: {}

cassandra:
  enabled: false
  image:
    repository: docker.io/library/cassandra
    tag: "5.0"
    pullPolicy: IfNotPresent
  replicaCount: 3
  clusterName: conductor
  datacenter: dc1
  rack: rack1
  service:
    type: ClusterIP
    cqlPort: 9042
    intraNodePort: 7000
    tlsPort: 7001
    jmxPort: 7199
  heap:
    maxSize: 512M
    newSize: 128M
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClassName: ""
  resources: {}

fabric:
  exchanges:
    data: fabric.events
    control: system.control
    wardenWork: warden.work
  segments:
    - name: default
      vhost: conductor-default
      pkiDomain: default
      region: default
      participants: []
      releaseDomains: []
