{{- if eq (include "conductor.wardenEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conductor.fullname" . }}-warden
  labels:
{{ include "conductor.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conductor.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conductor.fullname" . }}-warden
{{- end }}
