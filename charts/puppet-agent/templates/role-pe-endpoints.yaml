apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "puppet-agent.fullname" . }}-pe-endpoints
  labels:
    {{- include "puppet-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames:
      - {{ include "puppet-agent.peReleaseFullname" . | quote }}
    verbs: ["get"]
