apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "puppet-agent.fullname" . }}-pe-endpoints
  labels:
    {{- include "puppet-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "puppet-agent.fullname" . }}-pe-endpoints
subjects:
  - kind: ServiceAccount
    name: {{ include "puppet-agent.serviceAccountName" . }}
